name: Deploy Azure Container App API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/azure-container-app-api.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/agentic-fitness-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Validate Azure credential secrets
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || (echo "Missing secret: AZURE_CLIENT_ID" && exit 1)
          test -n "${{ secrets.AZURE_CLIENT_SECRET }}" || (echo "Missing secret: AZURE_CLIENT_SECRET" && exit 1)
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || (echo "Missing secret: AZURE_SUBSCRIPTION_ID" && exit 1)
          test -n "${{ secrets.AZURE_TENANT_ID }}" || (echo "Missing secret: AZURE_TENANT_ID" && exit 1)
          test -n "${{ vars.AZURE_RESOURCE_GROUP }}" || (echo "Missing variable: AZURE_RESOURCE_GROUP" && exit 1)
          test -n "${{ vars.AZURE_API_CONTAINER_APP_NAME }}" || (echo "Missing variable: AZURE_API_CONTAINER_APP_NAME" && exit 1)
          test -n "${{ vars.GEMINI_MODEL }}" || (echo "Missing variable: GEMINI_MODEL" && exit 1)
          test -n "${{ vars.CORS_ORIGINS }}" || (echo "Missing variable: CORS_ORIGINS" && exit 1)

      - uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            AZURE_SUBSCRIPTION_ID="$(printf '%s' "$AZURE_SUBSCRIPTION_ID" | xargs)"
            AZURE_RESOURCE_GROUP="$(printf '%s' "$AZURE_RESOURCE_GROUP" | xargs)"
            AZURE_API_CONTAINER_APP_NAME="$(printf '%s' "$AZURE_API_CONTAINER_APP_NAME" | xargs)"
            GEMINI_MODEL="$(printf '%s' "$GEMINI_MODEL" | xargs)"
            CORS_ORIGINS="$(printf '%s' "$CORS_ORIGINS" | xargs)"

            echo "Setting Azure subscription"
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            az account show --query "{subscriptionId:id, tenantId:tenantId, name:name}" -o table
            echo "Updating API Container App through containerapp CLI"
            az extension add --name containerapp --upgrade --allow-preview true
            az containerapp update \
              --name "$AZURE_API_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$API_IMAGE" \
              --min-replicas 0 \
              --max-replicas 1 \
              --set-env-vars \
                ENVIRONMENT=azure \
                PERSISTENCE_ENABLED=false \
                LLM_PROVIDER=gemini \
                GEMINI_MODEL="$GEMINI_MODEL" \
                LLM_ACCESS_CONTROL_ENABLED=true \
                CORS_ORIGINS="$CORS_ORIGINS"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_API_CONTAINER_APP_NAME: ${{ vars.AZURE_API_CONTAINER_APP_NAME }}
          API_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
