name: Deploy Azure Container App API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/azure-container-app-api.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/agentic-fitness-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Validate Azure credential secrets
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || (echo "Missing secret: AZURE_CLIENT_ID" && exit 1)
          test -n "${{ secrets.AZURE_CLIENT_SECRET }}" || (echo "Missing secret: AZURE_CLIENT_SECRET" && exit 1)
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || (echo "Missing secret: AZURE_SUBSCRIPTION_ID" && exit 1)
          test -n "${{ secrets.AZURE_TENANT_ID }}" || (echo "Missing secret: AZURE_TENANT_ID" && exit 1)
          test -n "${{ vars.AZURE_RESOURCE_GROUP }}" || (echo "Missing variable: AZURE_RESOURCE_GROUP" && exit 1)
          test -n "${{ vars.AZURE_API_CONTAINER_APP_NAME }}" || (echo "Missing variable: AZURE_API_CONTAINER_APP_NAME" && exit 1)
          test -n "${{ vars.GEMINI_MODEL }}" || (echo "Missing variable: GEMINI_MODEL" && exit 1)
          test -n "${{ vars.CORS_ORIGINS }}" || (echo "Missing variable: CORS_ORIGINS" && exit 1)

      - uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: azure/cli@v2
        with:
          inlineScript: |
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            az account show --query "{subscriptionId:id, tenantId:tenantId, name:name}" -o table
            az resource show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_API_CONTAINER_APP_NAME }}" \
              --resource-type "Microsoft.App/containerApps" \
              --output json > /tmp/current-api-containerapp.json

            python - <<'PY' > /tmp/api-containerapp-template.json
            import json
            import os

            with open("/tmp/current-api-containerapp.json", encoding="utf-8") as file:
                current = json.load(file)

            properties = current["properties"]
            configuration = properties.get("configuration") or {}
            template = properties.get("template") or {}
            containers = template.get("containers") or [{}]
            container = containers[0]
            container["name"] = container.get("name") or os.environ["AZURE_API_CONTAINER_APP_NAME"]
            container["image"] = os.environ["API_IMAGE"]
            container["env"] = [
                {"name": "ENVIRONMENT", "value": "azure"},
                {"name": "PERSISTENCE_ENABLED", "value": "false"},
                {"name": "LLM_PROVIDER", "value": "gemini"},
                {"name": "GEMINI_MODEL", "value": os.environ["GEMINI_MODEL"]},
                {"name": "LLM_ACCESS_CONTROL_ENABLED", "value": "true"},
                {"name": "CORS_ORIGINS", "value": os.environ["CORS_ORIGINS"]},
                {"name": "GEMINI_API_KEY", "secretRef": "gemini-api-key"},
                {"name": "DEMO_ACCESS_CODE", "secretRef": "demo-access-code"},
            ]
            template["containers"] = [container]
            template["scale"] = {"minReplicas": 0, "maxReplicas": 1}
            configuration["secrets"] = [
                {"name": "gemini-api-key", "value": os.environ["GEMINI_API_KEY"]},
                {"name": "demo-access-code", "value": os.environ["DEMO_ACCESS_CODE"]},
            ]

            next_properties = {
                "managedEnvironmentId": properties["managedEnvironmentId"],
                "configuration": configuration,
                "template": template,
            }

            deployment = {
                "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
                "contentVersion": "1.0.0.0",
                "resources": [
                    {
                        "type": "Microsoft.App/containerApps",
                        "apiVersion": "2024-03-01",
                        "name": current["name"],
                        "location": current["location"],
                        "properties": next_properties,
                    }
                ],
                "outputs": {
                    "containerAppName": {
                        "type": "string",
                        "value": current["name"],
                    }
                }
            }
            print(json.dumps(deployment))
            PY

            az deployment group create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file /tmp/api-containerapp-template.json
        env:
          AZURE_API_CONTAINER_APP_NAME: ${{ vars.AZURE_API_CONTAINER_APP_NAME }}
          API_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEMO_ACCESS_CODE: ${{ secrets.DEMO_ACCESS_CODE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
