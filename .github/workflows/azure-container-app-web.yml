name: Deploy Azure Container App Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/azure-container-app-web.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/agentic-fitness-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Validate Azure credential secrets
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || (echo "Missing secret: AZURE_CLIENT_ID" && exit 1)
          test -n "${{ secrets.AZURE_CLIENT_SECRET }}" || (echo "Missing secret: AZURE_CLIENT_SECRET" && exit 1)
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || (echo "Missing secret: AZURE_SUBSCRIPTION_ID" && exit 1)
          test -n "${{ secrets.AZURE_TENANT_ID }}" || (echo "Missing secret: AZURE_TENANT_ID" && exit 1)
          test -n "${{ vars.AZURE_RESOURCE_GROUP }}" || (echo "Missing variable: AZURE_RESOURCE_GROUP" && exit 1)
          test -n "${{ vars.AZURE_WEB_CONTAINER_APP_NAME }}" || (echo "Missing variable: AZURE_WEB_CONTAINER_APP_NAME" && exit 1)
          test -n "${{ vars.NEXT_PUBLIC_API_URL }}" || (echo "Missing variable: NEXT_PUBLIC_API_URL" && exit 1)

      - uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: azure/cli@v2
        with:
          inlineScript: |
            az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            az account show --query "{subscriptionId:id, tenantId:tenantId, name:name}" -o table
            APP_URL="https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.App/containerApps/${{ vars.AZURE_WEB_CONTAINER_APP_NAME }}?api-version=2024-03-01"
            az rest --method get --url "$APP_URL" --query "{name:name, location:location}" -o table

            python - <<'PY' > /tmp/web-containerapp-patch.json
            import json
            import os

            body = {
                "properties": {
                    "template": {
                        "scale": {"minReplicas": 0, "maxReplicas": 1},
                        "containers": [
                            {
                                "name": os.environ["AZURE_WEB_CONTAINER_APP_NAME"],
                                "image": os.environ["WEB_IMAGE"],
                                "env": [
                                    {"name": "NODE_ENV", "value": "production"},
                                    {"name": "NEXT_PUBLIC_API_URL", "value": os.environ["NEXT_PUBLIC_API_URL"]},
                                ],
                            }
                        ],
                    },
                }
            }
            print(json.dumps(body))
            PY

            az rest --method patch --url "$APP_URL" --body @/tmp/web-containerapp-patch.json
        env:
          AZURE_WEB_CONTAINER_APP_NAME: ${{ vars.AZURE_WEB_CONTAINER_APP_NAME }}
          WEB_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
