name: Deploy Azure Container App Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/azure-container-app-web.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/agentic-fitness-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_WEB_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              --min-replicas 0 \
              --max-replicas 1 \
              --set-env-vars \
                NODE_ENV=production \
                NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}"
