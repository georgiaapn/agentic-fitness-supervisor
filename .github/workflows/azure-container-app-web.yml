name: Deploy Azure Container App Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/azure-container-app-web.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/agentic-fitness-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Validate Azure credential secrets
        run: |
          test -n "${{ secrets.AZURE_CLIENT_ID }}" || (echo "Missing secret: AZURE_CLIENT_ID" && exit 1)
          test -n "${{ secrets.AZURE_CLIENT_SECRET }}" || (echo "Missing secret: AZURE_CLIENT_SECRET" && exit 1)
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" || (echo "Missing secret: AZURE_SUBSCRIPTION_ID" && exit 1)
          test -n "${{ secrets.AZURE_TENANT_ID }}" || (echo "Missing secret: AZURE_TENANT_ID" && exit 1)
          test -n "${{ vars.AZURE_RESOURCE_GROUP }}" || (echo "Missing variable: AZURE_RESOURCE_GROUP" && exit 1)
          test -n "${{ vars.AZURE_WEB_CONTAINER_APP_NAME }}" || (echo "Missing variable: AZURE_WEB_CONTAINER_APP_NAME" && exit 1)
          test -n "${{ vars.NEXT_PUBLIC_API_URL }}" || (echo "Missing variable: NEXT_PUBLIC_API_URL" && exit 1)

      - uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: azure/cli@v2
        with:
          inlineScript: |
            AZURE_SUBSCRIPTION_ID="$(printf '%s' "$AZURE_SUBSCRIPTION_ID" | xargs)"
            AZURE_RESOURCE_GROUP="$(printf '%s' "$AZURE_RESOURCE_GROUP" | xargs)"
            AZURE_WEB_CONTAINER_APP_NAME="$(printf '%s' "$AZURE_WEB_CONTAINER_APP_NAME" | xargs)"
            NEXT_PUBLIC_API_URL="$(printf '%s' "$NEXT_PUBLIC_API_URL" | xargs)"

            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            az account show --query "{subscriptionId:id, tenantId:tenantId, name:name}" -o table
            az resource show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEB_CONTAINER_APP_NAME" \
              --resource-type "Microsoft.App/containerApps" \
              --output json > /tmp/current-web-containerapp.json

            python - <<'PY' > /tmp/web-containerapp-template.json
            import json
            import os

            with open("/tmp/current-web-containerapp.json", encoding="utf-8") as file:
                current = json.load(file)

            properties = current["properties"]
            configuration = properties.get("configuration") or {}
            template = properties.get("template") or {}
            containers = template.get("containers") or [{}]
            container = containers[0]
            container["name"] = container.get("name") or os.environ["AZURE_WEB_CONTAINER_APP_NAME"]
            container["image"] = os.environ["WEB_IMAGE"]
            container["env"] = [
                {"name": "NODE_ENV", "value": "production"},
                {"name": "NEXT_PUBLIC_API_URL", "value": os.environ["NEXT_PUBLIC_API_URL"]},
            ]
            template["containers"] = [container]
            template["scale"] = {"minReplicas": 0, "maxReplicas": 1}

            next_properties = {
                "managedEnvironmentId": properties["managedEnvironmentId"],
                "configuration": configuration,
                "template": template,
            }

            deployment = {
                "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentTemplate.json#",
                "contentVersion": "1.0.0.0",
                "resources": [
                    {
                        "type": "Microsoft.App/containerApps",
                        "apiVersion": "2024-03-01",
                        "name": current["name"],
                        "location": current["location"],
                        "properties": next_properties,
                    }
                ],
                "outputs": {
                    "containerAppName": {
                        "type": "string",
                        "value": current["name"],
                    }
                }
            }
            print(json.dumps(deployment))
            PY

            az deployment group create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file /tmp/web-containerapp-template.json
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEB_CONTAINER_APP_NAME: ${{ vars.AZURE_WEB_CONTAINER_APP_NAME }}
          WEB_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
