services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fitness_agents
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://fitness:fitness@postgres:5432/fitness_agents
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:

